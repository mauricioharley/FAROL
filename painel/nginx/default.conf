server {
    listen       8080 ssl;
    listen  [::]:8080 ssl;
    server_name  localhost;

    ssl_certificate /etc/nginx/certs/painel.crt;
    ssl_certificate_key /etc/nginx/certs/painel.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";

    # Login por sessão (cookie assinado, checado pelo próprio painel) só
    # deixa de trafegar em claro por causa deste terminador TLS - o painel em
    # si continua só em HTTP puro, alcançável apenas dentro da rede do
    # compose (ver "expose" em vez de "ports" no serviço painel).

    # Painel gerencial (React/Vite, estático) - serviço separado, mesmo
    # domínio/cookie de sessão do painel técnico. Path passa sem reescrita:
    # o build do gerencial já gera asset apontando pra esse prefixo (ver
    # painel-gerencial/vite.config.js, base: '/gerencial/').
    location /gerencial/ {
        proxy_pass http://painel-gerencial:8080;
        proxy_set_header Host $host;
    }

    # API JSON do painel gerencial - mesmo backend do painel técnico
    # (main.py), mesma checagem de sessão.
    location /api/ {
        proxy_pass http://painel:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
    }

    # Painel técnico (HTML server-rendered) + login/logout + ingestão de
    # achado do plugin - tudo o que não casou com os prefixos acima.
    location / {
        proxy_pass http://painel:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
    }
}
