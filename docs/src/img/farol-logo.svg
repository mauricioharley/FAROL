<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1F5750"/>
      <stop offset="100%" stop-color="#0E2C28"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F1F4F1"/>
      <stop offset="100%" stop-color="#C7D2C7"/>
    </linearGradient>
    <linearGradient id="beamL" x1="1" y1="0.5" x2="0" y2="0.5">
      <stop offset="0%" stop-color="#FBF1D9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E0B357" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamR" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#FBF1D9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E0B357" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- feixes de luz, saindo do centro da lanterna -->
  <polygon points="256,176 26,124 26,156" fill="url(#beamL)"/>
  <polygon points="256,176 486,124 486,156" fill="url(#beamR)"/>

  <!-- ondas -->
  <path d="M30 410 Q75 393 120 410 T210 410 T300 410 T390 410 T482 410"
        fill="none" stroke="#57C2AE" stroke-width="9" stroke-linecap="round" opacity="0.5"/>
  <path d="M15 434 Q65 415 115 434 T215 434 T315 434 T415 434 T497 434"
        fill="none" stroke="#57C2AE" stroke-width="9" stroke-linecap="round" opacity="0.3"/>

  <!-- rocha -->
  <polygon points="196,398 214,352 298,352 316,398" fill="#0E2C28"/>

  <!-- torre -->
  <polygon points="226,352 286,352 271,198 241,198" fill="url(#tower)"/>

  <!-- faixas vermelhas -->
  <polygon points="230.5,322 281.5,322 278.3,293 233.7,293" fill="#9E3A2D"/>
  <polygon points="238,257 274,257 271.5,228 240.5,228" fill="#9E3A2D"/>

  <!-- porta -->
  <path d="M247 352 v-24 a9 9 0 0 1 18 0 v24 z" fill="#0E2C28"/>

  <!-- varanda -->
  <rect x="234" y="192" width="44" height="9" rx="2" fill="#123C37"/>
  <rect x="224" y="200" width="64" height="7" rx="2" fill="#0E2C28"/>

  <!-- sala da lanterna -->
  <rect x="229" y="158" width="54" height="36" fill="#FBF1D9" stroke="#123C37" stroke-width="4"/>
  <line x1="256" y1="158" x2="256" y2="194" stroke="#123C37" stroke-width="3"/>

  <!-- cupula, encaixada sem folga sobre a sala da lanterna -->
  <polygon points="227,159 285,159 256,120" fill="#9E3A2D"/>
  <rect x="253" y="106" width="6" height="15" rx="2" fill="#9E3A2D"/>
  <circle cx="256" cy="104" r="4.5" fill="#9E3A2D"/>

  <!-- luz -->
  <circle cx="256" cy="176" r="24" fill="#FBF1D9" opacity="0.28"/>
  <circle cx="256" cy="176" r="11" fill="#FFF7E0"/>
</svg>
