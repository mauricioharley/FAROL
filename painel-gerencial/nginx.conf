server {
    listen 8080;
    server_tokens off;

    # Só serve estático sob /gerencial/ - alinhado com o `base: '/gerencial/'`
    # do vite.config.js, que gera todo asset (JS/CSS com hash) apontando pra
    # esse prefixo. O terminador TLS (painel-nginx) é quem encaminha
    # requisição de /gerencial/* pra este serviço, sem reescrever o path.
    location /gerencial/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /gerencial/index.html;
    }

    location = /gerencial {
        return 301 /gerencial/;
    }
}
